name: Unit Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Non-blocking for now: the codebase has a lint baseline to burn down.
      # Flip to a hard gate (remove continue-on-error) once findings are cleared.
      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v -m "not slow"
